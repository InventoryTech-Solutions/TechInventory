<nav class="navbar">
  <div class="brand">
    <span>📦 Control Stock</span>
  </div>

  <div class="nav-links">
    <a routerLink="/catalogo" routerLinkActive="active">Catálogo</a>
    <a routerLink="/gestion" routerLinkActive="active">Gestión de Inventario</a>
  </div>

  <div class="auth-section">
    @if (estaLogueado) {
      <span class="user-name">👤 {{ usuarioNombre }}</span>
      <button class="btn-logout" (click)="cerrarSesion()">Cerrar Sesión</button>
    } @else {
      <a routerLink="/registro" class="btn-registro">Registrarse</a>
      <a routerLink="/login" class="btn-login">Iniciar Sesión</a>
    }
  </div>
</nav>
