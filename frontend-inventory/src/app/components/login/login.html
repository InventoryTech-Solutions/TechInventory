<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <span class="logo">📦 Control Stock</span>
      <h2>Iniciar Sesión</h2>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input id="email" type="email" formControlName="email"
          [class.invalid]="f['email'].invalid && f['email'].touched"
          placeholder="tucorreo@ejemplo.com" />
        @if (f['email'].invalid && f['email'].touched) {
          <span class="error">Ingresa un correo válido</span>
        }
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input id="password" type="password" formControlName="password"
          [class.invalid]="f['password'].invalid && f['password'].touched"
          placeholder="Tu contraseña" />
        @if (f['password'].invalid && f['password'].touched) {
          <span class="error">Ingresa tu contraseña</span>
        }
      </div>

      @if (errorMensaje) {
        <div class="error-general">{{ errorMensaje }}</div>
      }

      <button type="submit" class="btn-registrar" [disabled]="enviando">
        {{ enviando ? 'Ingresando...' : 'Iniciar Sesión' }}
      </button>
    </form>

    <button type="button" class="btn-azure" (click)="loginConAzure()">
      <svg class="ms-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 21 21" width="18" height="18">
        <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
        <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
        <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
        <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
      </svg>
      Iniciar sesión con Microsoft
    </button>

    <p class="link-login">¿No tienes cuenta? <a routerLink="/registro">Regístrate</a></p>
  </div>
</div>
