spring.application.name=backend-inventory

# Configuración de Base de Datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:inventorydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Permite visualizar la consola de H2 en el navegador (http://localhost:8080/h2-console)
spring.h2.console.enabled=true

# Muestra en consola las consultas SQL ejecutadas por Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true

# Puerto del servidor
server.port=8080

# Configuración del servidor OAuth2 Resource Server (Azure AD)
# Reemplaza {TENANT_ID} con el ID de inquilino asignado en Azure AD
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/{TENANT_ID}/v2.0

# JWT propio para login/registro público (clientes, sin Azure)
jwt.secret=CambiaEstaClaveLargaySecretaDeAlMenos32Caracteres123
jwt.expiration-ms=86400000